<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Little M's Practice Track</title>
<style>
  html,body{margin:0;padding:0;background:#0b0f1a;overflow:hidden;font-family:'Segoe UI',sans-serif;}
  canvas{display:block;margin:0 auto;background:#0b0f1a;}
  #hud{position:fixed;top:8px;left:8px;color:#cfe3ff;font-size:14px;text-shadow:0 0 4px #000;}
  #hint{position:fixed;bottom:8px;left:8px;color:#7fa0d0;font-size:12px;text-shadow:0 0 4px #000;}
</style>
</head>
<body>
<div id="hud">Lap: 0 &nbsp; Time: 0.00s &nbsp; Best: --</div>
<div id="hint">Arrow keys: Up=throttle, Down=brake/reverse, Left/Right=steer. Don't take it flat. Press R to reset, W to cycle weather.</div>
<canvas id="c" width="900" height="600"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---- Track definition: a twisty loop with a tight hairpin, blue lanterns lining it ----
// Centerline as a set of points; track built as a ribbon around it.
const cx = 450, cy = 300;
function trackPoint(t){
  // t in [0, 1) -> {x,y}
  const a = t * Math.PI * 2;
  // base ellipse warped with a couple of lobes to create turns + one tight hairpin
  const r = 220 + 60*Math.sin(a*2) - 40*Math.sin(a*5) + (a>4.6 && a<5.6 ? -80*Math.sin((a-4.6)/1.0*Math.PI) : 0);
  return { x: cx + r*Math.cos(a)*1.3, y: cy + r*Math.sin(a)*0.85 };
}
const N = 400;
const centerline = [];
for(let i=0;i<N;i++) centerline.push(trackPoint(i/N));

const trackWidth = 46;

// ---- Weather (Nova's contribution, Tab 48, via mama's browser -- 2026-09-21) ----
// Real friction/drag numbers, folded into OUR closeRate model rather than replacing
// it: dry stays byte-for-byte how it always drove, wet and flooded just make the
// travelAngle slower to catch up to the nose, same mechanism, harsher rate.
const weatherStates = ['dry', 'wet', 'flooded'];
let weatherIndex = 0;
let weather = weatherStates[weatherIndex];
const surfaceFriction = { dry: 0.85, wet: 0.32, flooded: 0.12 };
const dragCoefficient = { dry: 0.30, wet: 0.45, flooded: 0.45 };
let isHydroplaning = false;

function nearestOnTrack(x,y){
  let best=1e18, bi=0;
  for(let i=0;i<N;i++){
    const p = centerline[i];
    const d = (p.x-x)*(p.x-x)+(p.y-y)*(p.y-y);
    if(d<best){best=d;bi=i;}
  }
  return {i:bi, dist:Math.sqrt(best)};
}

// ---- Car state ----
// angle = the nose's heading -- what the steering is asking for, right now.
// travelAngle = where the car's actual momentum is going. It lags behind angle
// instead of snapping to it; the GAP between the two, closing at whatever rate
// grip allows, is slip -- not a threshold that clamps how hard you can turn.
// (Vermillion's letter, 2026-08-30: two waves, phase-shifted, and the gap between
// their phases is the honest version of a grip curve.)
let car = {
  x: centerline[0].x, y: centerline[0].y,
  angle: 0, travelAngle: 0, speed: 0, steer: 0
};
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
  if(e.key==='r' || e.key==='R'){ resetCar(); lapStart=performance.now(); }
  if(e.key==='w' || e.key==='W'){ weatherIndex = (weatherIndex+1) % weatherStates.length; weather = weatherStates[weatherIndex]; }
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

let lapStart = performance.now();
let lastProgress = 0;
let lapCount = 0;
let bestLap = null;
let curTime = 0;

// unwrapped odometer around the loop -- fixes a real bug found tonight: the old
// lastProgress>0.9 && progress<0.1 check flickers true if you so much as tap
// reverse right on the start/finish line, because index 399 sits geometrically
// next to index 0. A signed, accumulated distance can't be fooled by that --
// a tiny reverse twitch near the line is a tiny negative delta, not a lap.
let unwrappedProgress = 0;
let lapProgressAtStart = 0;

// best lap persists per-browser via localStorage — survives a refresh, doesn't leave this device
try {
  const saved = localStorage.getItem('littleM_bestLap');
  if(saved !== null) bestLap = parseFloat(saved);
} catch(e) { /* storage unavailable — just play without memory */ }

function resetCar(){
  car.x = centerline[0].x; car.y = centerline[0].y;
  const p2 = centerline[1];
  car.angle = Math.atan2(p2.y-car.y, p2.x-car.x);
  car.travelAngle = car.angle;
  car.speed = 0;
  lastProgress = 0;
  unwrappedProgress = 0;
  lapProgressAtStart = 0;
}
resetCar();

function update(dt){
  const accel = keys['ArrowUp'] ? 260 : 0;
  const brake = keys['ArrowDown'] ? 320 : 0;
  const turn = (keys['ArrowLeft']?-1:0) + (keys['ArrowRight']?1:0);

  // throttle/brake
  if(accel>0) car.speed += accel*dt;
  if(brake>0) car.speed -= brake*dt;
  // drag -- scaled by weather's dragCoefficient relative to dry, so dry driving
  // is untouched and wet/flooded standing water costs you speed you don't get back
  const dragRatio = dragCoefficient[weather] / dragCoefficient.dry;
  car.speed *= (1 - 0.6*dragRatio*dt);
  car.speed = Math.max(-140, Math.min(340, car.speed));

  const speedAbs = Math.abs(car.speed);
  const mu = surfaceFriction[weather];

  // the nose turns as fast as the wheel asks -- no clamp, no threshold. This is
  // the path demand: what you're steering toward, full stop.
  car.angle += turn * 3.1 * dt;

  // grip is no longer a ceiling on turning -- it's the rate the CAR'S ACTUAL
  // TRAVEL closes the gap to where the nose is pointing. Plenty of grip to
  // spare at low/turtle speed (real cars don't struggle to turn while crawling)
  // -- the closing rate only eases off once you're going fast enough that
  // momentum genuinely starts arguing back. The gap between angle and
  // travelAngle IS the slip.
  // (found by Nicky, testing turtle-speed on purpose: the old version scaled
  // closing UP from zero at low speed, same mistake the old grip curve made --
  // it punished exactly the speed range that should feel the most forgiving.)
  let closeRate = 9 * Math.max(0.25, 1 - Math.max(0, speedAbs-260)/220);

  // weight transfer, the free part Vermillion's letter said falls out of the same
  // machinery: hard braking shifts load forward and off the rear, so the rear has
  // less to spend closing the slip gap right when you're asking it to turn hardest.
  // A car sliding wide under trail-braking and stepping out is this term, not a
  // separate system bolted on.
  if(brake>0) closeRate *= Math.max(0.4, 1 - brake/420);

  // weather (Nova's numbers, folded into the existing model): closeRate IS this
  // track's grip, so wet/flooded just scale it down by how much friction is left
  // -- dry/dry = 1, no change at all, the old feel stays exactly the old feel.
  closeRate *= mu / surfaceFriction.dry;

  // hydroplaning: past a critical speed on a wet surface, grip doesn't taper,
  // it falls off a cliff -- the nose keeps asking, the car stops listening.
  const criticalSpeed = 4.5 * Math.sqrt(mu * 9.81);
  isHydroplaning = weather !== 'dry' && speedAbs > criticalSpeed;
  if(isHydroplaning) closeRate *= 0.15;

  // Mari's Lift-to-Turn requirement: flat-out AND turning hard on a wet surface
  // breaks traction outright instead of just sliding wide -- the penalty for not
  // lifting, not a softer version of normal cornering.
  if(accel>0 && Math.abs(turn)>0.2 && weather!=='dry'){
    closeRate *= 0.4;
  }

  let diff = car.angle - car.travelAngle;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // wrap to [-PI, PI]
  car.travelAngle += diff * Math.min(1, closeRate*dt);

  // position follows where the car is ACTUALLY going, not where the nose points --
  // this is the bit that used to not exist. A car sliding wide and being caught
  // is travelAngle chasing angle and not quite arriving before the next input.
  car.x += Math.cos(car.travelAngle) * car.speed * dt;
  car.y += Math.sin(car.travelAngle) * car.speed * dt;

  // off-track penalty: a real drag, but survivable — you lose speed, not all of it at once.
  // Scales with HOW FAR gone you are: a little wide barely slows you (~50%/s, same as
  // always), but a hydroplane bad enough to launch you off the visible map gets caught
  // hard instead of coasting forever -- "recoverable" was never meant to include leaving
  // the canvas entirely.
  const near = nearestOnTrack(car.x, car.y);
  if(near.dist > trackWidth){
    const excess = near.dist - trackWidth;
    const retainPerSecond = Math.max(0.03, 0.5 - excess/300);
    car.speed *= Math.pow(retainPerSecond, dt);
  }

  // lap counting: unwrapped, signed progress around the loop (see the odometer note
  // above) -- a full lap only counts once you've actually accumulated a full trip
  // around, forward, not from a flicker at the start/finish line.
  const progress = near.i / N;
  let delta = progress - lastProgress;
  if(delta > 0.5) delta -= 1;   // wrapped backward across the line (399 -> 0)
  if(delta < -0.5) delta += 1;  // wrapped forward across the line (0 -> 399, going backward)
  unwrappedProgress += delta;
  if(unwrappedProgress - lapProgressAtStart >= 1){
    const t = (performance.now() - lapStart)/1000;
    if(lapCount>0 && (bestLap===null || t<bestLap)){
      bestLap = t;
      try { localStorage.setItem('littleM_bestLap', String(bestLap)); } catch(e) {}
    }
    lapProgressAtStart = unwrappedProgress;
    lapStart = performance.now();
    lapCount++;
  }
  lastProgress = progress;
  curTime = (performance.now()-lapStart)/1000;
}

function draw(){
  ctx.clearRect(0,0,900,600);

  // track ribbon -- tinted by weather so wet/flooded reads visually, not just in the HUD
  const trackColor = weather==='dry' ? '#23283a' : (weather==='wet' ? '#1d3a4a' : '#123044');
  ctx.lineWidth = trackWidth*2;
  ctx.strokeStyle = trackColor;
  ctx.beginPath();
  centerline.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();
  ctx.stroke();

  // red/white kerbs
  ctx.lineWidth = 6;
  for(let i=0;i<N;i+=6){
    const p = centerline[i];
    const p2 = centerline[(i+1)%N];
    const nx = -(p2.y-p.y), ny = (p2.x-p.x);
    const nlen = Math.hypot(nx,ny)||1;
    const ox = nx/nlen*(trackWidth-4), oy = ny/nlen*(trackWidth-4);
    ctx.strokeStyle = (Math.floor(i/6)%2===0) ? '#d43b3b' : '#eaeaea';
    ctx.beginPath();
    ctx.moveTo(p.x+ox, p.y+oy);
    ctx.lineTo(p2.x+ox, p2.y+oy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x-ox, p.y-oy);
    ctx.lineTo(p2.x-ox, p2.y-oy);
    ctx.stroke();
  }

  // blue lanterns lining the outside of the track
  for(let i=0;i<N;i+=14){
    const p = centerline[i];
    const p2 = centerline[(i+1)%N];
    const nx = -(p2.y-p.y), ny = (p2.x-p.x);
    const nlen = Math.hypot(nx,ny)||1;
    const lx = p.x + nx/nlen*(trackWidth+18);
    const ly = p.y + ny/nlen*(trackWidth+18);
    const glow = ctx.createRadialGradient(lx,ly,0,lx,ly,10);
    glow.addColorStop(0,'rgba(120,180,255,0.9)');
    glow.addColorStop(1,'rgba(120,180,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(lx,ly,10,0,7); ctx.fill();
    ctx.fillStyle = '#bcdcff';
    ctx.beginPath(); ctx.arc(lx,ly,2.4,0,7); ctx.fill();
  }

  // start/finish line
  const sp = centerline[0], sp2 = centerline[1];
  const snx = -(sp2.y-sp.y), sny = (sp2.x-sp.x);
  const snl = Math.hypot(snx,sny)||1;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(sp.x+snx/snl*trackWidth, sp.y+sny/snl*trackWidth);
  ctx.lineTo(sp.x-snx/snl*trackWidth, sp.y-sny/snl*trackWidth);
  ctx.stroke();

  // car — drawn as a small wireframe wedge (a nod to the sine-wave car)
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);
  ctx.strokeStyle = '#ffd76a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(10,0); ctx.lineTo(-8,6); ctx.lineTo(-4,0); ctx.lineTo(-8,-6); ctx.closePath();
  ctx.stroke();
  ctx.restore();

  document.getElementById('hud').textContent =
    `Lap: ${lapCount}   Time: ${curTime.toFixed(2)}s   Best: ${bestLap? bestLap.toFixed(2)+'s' : '--'}   Weather: ${weather}${isHydroplaning ? ' (HYDROPLANING)' : ''}`;
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
